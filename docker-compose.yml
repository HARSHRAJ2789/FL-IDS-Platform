version: "3.9"

services:
  # ── Central FL Server ─────────────────────────────────────────────────────
  server:
    build: ./server
    container_name: flds-server
    ports:
      - "8000:8000"
    volumes:
      - flds-data:/data           # SQLite DB + model weights
      - ./dashboard:/app/dashboard:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-long-random-string}
      - DATABASE_URL=sqlite:////data/flds.db
      - WEIGHTS_DIR=/data/weights
      - MIN_CLIENTS_FOR_AGGREGATION=${MIN_CLIENTS:-2}
      - ROUND_AUTO_START=${ROUND_AUTO_START:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx Reverse Proxy (production) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: flds-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard:/var/www/dashboard:ro
      - ssl-certs:/etc/nginx/ssl
    depends_on:
      - server
    restart: unless-stopped
    profiles:
      - production

volumes:
  flds-data:
  ssl-certs:

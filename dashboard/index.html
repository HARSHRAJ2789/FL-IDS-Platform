<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL-IDS | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03060f;
            --cyan: #00e5ff;
            --green: #39ff14;
            --purple: #a855f7;
            --red: #ff4444;
            --glass-bg: rgba(16, 22, 38, 0.6);
            --glass-border: rgba(0, 229, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Rain Canvas */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.1), inset 0 0 20px rgba(0, 229, 255, 0.05);
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
            letter-spacing: -1px;
        }

        .logo h1 span {
            color: var(--purple);
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            background: rgba(3, 6, 15, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            background: rgba(3, 6, 15, 0.8);
        }

        .form-group input:focus + label {
            color: var(--cyan);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--cyan), #0099ff);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 229, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .toggle-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .toggle-link a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .toggle-link a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--cyan);
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Forms toggle */
        #register-form {
            display: none;
        }

        .error-msg {
            display: none;
            color: var(--red);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 6px;
        }

        /* API Key Box */
        #api-key-box {
            display: none;
            margin-top: 1.5rem;
            text-align: center;
        }

        .api-key-display {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--purple);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--green);
            margin: 1rem 0;
            word-break: break-all;
            position: relative;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(0, 229, 255, 0.1);
        }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="auth-container">
        <div class="glass-card" id="auth-card">
            <div class="logo">
                <h1>FL-IDS<span>.</span></h1>
            </div>
            
            <div id="error-box" class="error-msg"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="admin@org.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">
                    <span class="btn-text">Initialize Link</span>
                    <div class="spinner"></div>
                </button>
                <div class="toggle-link">
                    New to the network? <a href="#" onclick="toggleForm('register')">Register organization</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form">
                <div class="form-group">
                    <label>Organization Name</label>
                    <input type="text" id="reg-org" required placeholder="CyberCorp Inc.">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required placeholder="admin@cybercorp.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">
                    <span class="btn-text">Register Node</span>
                    <div class="spinner"></div>
                </button>
                <div class="toggle-link">
                    Already registered? <a href="#" onclick="toggleForm('login')">Return to login</a>
                </div>
            </form>

            <!-- API Key Display -->
            <div id="api-key-box">
                <h3 style="color: var(--cyan); font-size: 1.1rem; margin-bottom: 0.5rem;">Registration Successful</h3>
                <p style="font-size: 0.875rem; color: var(--text-muted);">Save this API key. You won't be able to see it again.</p>
                <div class="api-key-display" id="new-api-key"></div>
                <button type="button" class="copy-btn" onclick="copyApiKey()">Copy Key</button>
                <button type="button" class="btn" style="margin-top: 1rem;" onclick="toggleForm('login')">Proceed to Login</button>
            </div>
        </div>
    </div>

    <script>
        // Matrix Rain Background
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array.from({length: columns}).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 6, 15, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00e5ff';
            ctx.font = fontSize + 'px "JetBrains Mono"';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // UI Logic
        function toggleForm(form) {
            document.getElementById('error-box').style.display = 'none';
            if (form === 'register') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
                document.getElementById('api-key-box').style.display = 'none';
            } else {
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('api-key-box').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('error-box');
            errBox.textContent = msg;
            errBox.style.display = 'block';
        }

        function setLoading(formId, isLoading) {
            const btn = document.querySelector(`#${formId} .btn`);
            if (!btn) return;
            const text = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            
            if (isLoading) {
                text.style.display = 'none';
                spinner.style.display = 'block';
                btn.disabled = true;
            } else {
                text.style.display = 'block';
                spinner.style.display = 'none';
                btn.disabled = false;
            }
        }

        function copyApiKey() {
            const key = document.getElementById('new-api-key').textContent;
            navigator.clipboard.writeText(key).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy Key', 2000);
            });
        }

        // ── API Base URL (set in config.js, falls back to same origin) ──────
        const API_BASE = (window.FL_IDS_API || '').replace(/\/$/, '');

        // Auth Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading('login-form', true);
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (!res.ok) throw new Error('Invalid credentials');
                
                const data = await res.json();
                localStorage.setItem('fl_token', data.access_token || data.token);
                localStorage.setItem('fl_api_base', API_BASE);
                // Stay on Netlify — portal.html is served here
                window.location.href = '/portal.html';
            } catch (err) {
                showError(err.message || 'Connection failed');
                setLoading('login-form', false);
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading('register-form', true);
            
            const org = document.getElementById('reg-org').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ org_name: org, email, password })
                });
                
                if (!res.ok) {
                    const errData = await res.json().catch(()=>({}));
                    throw new Error(errData.detail || 'Registration failed');
                }
                
                const data = await res.json();
                
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('api-key-box').style.display = 'block';
                document.getElementById('new-api-key').textContent = data.api_key || 'mock-api-key-' + Math.random().toString(36).substr(2, 9);
            } catch (err) {
                showError(err.message || 'Connection failed');
            } finally {
                setLoading('register-form', false);
            }
        });

        // Check if already logged in
        if (localStorage.getItem('fl_token')) {
            window.location.href = '/portal.html';
        }
    </script>
</body>
</html>
